<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-zinc-100 p-8 font-sans">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-black text-zinc-800 mb-6">Order Admin Portal</h1>

        <div id="login-section" class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="font-bold mb-4 text-xl">Admin Login</h2>
            <div id="login-error" class="hidden bg-red-100 text-red-600 p-2 rounded mb-3 text-sm font-bold"></div>
            <input type="email" id="email" placeholder="Email Address" class="w-full p-2 border rounded mb-3 bg-zinc-50">
            <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded mb-4 bg-zinc-50">
            <button onclick="login()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full transition-colors">Sign In</button>
        </div>

        <div id="admin-section" class="hidden space-y-6">
            
            <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-emerald-500">
                <h2 class="font-bold mb-4 text-xl text-emerald-600">Create New Order</h2>
                <div class="grid grid-cols-2 gap-4 mb-3">
                    <div>
                        <label class="text-xs font-bold text-zinc-500 uppercase">Public Name</label>
                        <input type="text" id="new-name" placeholder="e.g. July Order 01" class="w-full p-2 border rounded bg-zinc-50 mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-zinc-500 uppercase">Estimated ETA</label>
                        <input type="date" id="new-eta" class="w-full p-2 border rounded bg-zinc-50 mt-1">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="text-xs font-bold text-zinc-500 uppercase mb-1 block">Products Included</label>
                    <div id="products-container" class="space-y-2">
                        <div class="flex gap-2 product-line">
                            <input type="text" placeholder="e.g. Gem Vol 4" class="product-input flex-1 p-2 border rounded bg-zinc-50 text-sm">
                            <button type="button" onclick="removeProductLine(this)" class="bg-red-100 text-red-600 px-3 py-1 rounded font-bold hover:bg-red-200">✕</button>
                        </div>
                    </div>
                    <button type="button" onclick="addProductLine()" class="mt-2 text-xs bg-zinc-200 hover:bg-zinc-300 text-zinc-700 font-bold py-1.5 px-3 rounded flex items-center gap-1 transition-colors">
                        <span>+</span> Add Product
                    </button>
                </div>

                <button onclick="createOrder()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-4 rounded w-full transition-colors mt-2">Create Order</button>
            </div>

            <div id="orders-list" class="space-y-4">
                <p class="text-zinc-500 text-center font-bold animate-pulse">Loading data...</p>
            </div>
            
            <button onclick="logout()" class="text-sm text-zinc-500 hover:text-zinc-800 underline mt-8 block mx-auto">Logout</button>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto border-t-4 border-blue-500">
            <h2 class="text-2xl font-black text-zinc-800 mb-4">Edit Order Details</h2>
            
            <input type="hidden" id="edit-id">
            
            <div class="space-y-3 mb-6">
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase">Public Name</label>
                    <input type="text" id="edit-name" class="w-full p-2 border rounded bg-zinc-50 mt-1 font-bold">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase">Estimated ETA</label>
                    <input type="date" id="edit-eta" class="w-full p-2 border rounded bg-zinc-50 mt-1 font-bold">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase">Current Status Badge</label>
                    <select id="edit-status" class="w-full p-2 border rounded bg-zinc-50 mt-1 font-bold text-sm">
                        <option value="Preparing">Preparing</option>
                        <option value="Shipped">Shipped</option>
                        <option value="In Transit">In Transit</option>
                        <option value="Customs">Customs</option>
                        <option value="AusPost Hub">AusPost Hub</option>
                        <option value="Out for Delivery">Out for Delivery</option>
                        <option value="Delivered">Delivered</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase">Products (Comma Separated)</label>
                    <textarea id="edit-products" class="w-full p-2 border rounded bg-zinc-50 mt-1 font-bold text-sm" rows="2" placeholder="Item 1, Item 2, Item 3"></textarea>
                    <p class="text-[10px] text-zinc-400 mt-1">Separate each product with a comma.</p>
                </div>
            </div>
            
            <div class="flex justify-end gap-3 pt-4 border-t border-zinc-200">
                <button onclick="closeEditModal()" class="text-zinc-500 hover:text-zinc-800 font-bold px-4 py-2 transition-colors">Cancel</button>
                <button onclick="saveEditOrder()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded transition-colors shadow-md">Save Changes</button>
            </div>

            <div class="mt-6 pt-4 border-t-2 border-red-100 border-dashed">
                <button onclick="deleteOrder()" class="w-full bg-red-50 hover:bg-red-500 hover:text-white text-red-600 border border-red-200 font-black py-2.5 rounded transition-all">
                    DELETE THIS ORDER PERMANENTLY
                </button>
            </div>
        </div>
    </div>

    <div id="custom-alert" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-blue-500 text-center">
            <h3 id="alert-title" class="text-lg font-black text-zinc-800 mb-2">Notice</h3>
            <p id="alert-message" class="text-sm text-zinc-600 mb-6"></p>
            <button onclick="closeAlert()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded transition-colors w-full">OK</button>
        </div>
    </div>

    <div id="custom-confirm" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
        <div id="confirm-border" class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-amber-500 text-center">
            <h3 id="confirm-title" class="text-lg font-black text-zinc-800 mb-2">Confirm</h3>
            <p id="confirm-message" class="text-sm text-zinc-600 mb-6"></p>
            <div class="flex gap-3">
                <button onclick="closeConfirm(false)" class="flex-1 bg-zinc-200 hover:bg-zinc-300 text-zinc-800 font-bold px-4 py-2 rounded transition-colors">Cancel</button>
                <button id="confirm-yes-btn" onclick="closeConfirm(true)" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // --- CUSTOM MODAL CONTROLLERS ---
        function showCustomAlert(message, title = "Notice", color = "blue") {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('custom-alert').firstElementChild.className = `bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-${color}-500 text-center`;
            document.getElementById('custom-alert').classList.remove('hidden');
        }
        function closeAlert() { document.getElementById('custom-alert').classList.add('hidden'); }

        let pendingConfirmCallback = null;
        function showCustomConfirm(message, callback, title = "Confirm Action", isDanger = false) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            
            const borderBox = document.getElementById('confirm-border');
            const yesBtn = document.getElementById('confirm-yes-btn');
            
            if (isDanger) {
                borderBox.className = "bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-red-600 text-center";
                yesBtn.className = "flex-1 bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded transition-colors";
            } else {
                borderBox.className = "bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-blue-500 text-center";
                yesBtn.className = "flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded transition-colors";
            }

            pendingConfirmCallback = callback;
            document.getElementById('custom-confirm').classList.remove('hidden');
        }
        
        function closeConfirm(result) {
            document.getElementById('custom-confirm').classList.add('hidden');
            const callbackToRun = pendingConfirmCallback;
            pendingConfirmCallback = null; 
            if (result && callbackToRun) {
                callbackToRun();
            }
        }

        // 🛑 FIREBASE KEYS 🛑
        const firebaseConfig = {
            apiKey: "AIzaSyAHD0_l3t-aTEdlE_28Bspluk7KpL2GAbw",
            authDomain: "order-tracker-58390.firebaseapp.com",
            projectId: "order-tracker-58390",
            storageBucket: "order-tracker-58390.firebasestorage.app",
            messagingSenderId: "599840735038",
            appId: "1:599840735038:web:ce7938b2666e24d01c766f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allOrdersData = {};

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadOrders();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        });

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => {
                document.getElementById('login-error').innerText = err.message;
                document.getElementById('login-error').classList.remove('hidden');
            });
        }

        function logout() { auth.signOut(); }

        function addProductLine(value = '') {
            const container = document.getElementById('products-container');
            const div = document.createElement('div');
            div.className = 'flex gap-2 product-line';
            div.innerHTML = `
                <input type="text" placeholder="e.g. Gem Vol 5" value="${value}" class="product-input flex-1 p-2 border rounded bg-zinc-50 text-sm">
                <button type="button" onclick="removeProductLine(this)" class="bg-red-100 text-red-600 px-3 py-1 rounded font-bold hover:bg-red-200">✕</button>
            `;
            container.appendChild(div);
        }

        function removeProductLine(btn) {
            const container = document.getElementById('products-container');
            if (container.querySelectorAll('.product-line').length > 1) {
                btn.closest('.product-line').remove();
            } else {
                btn.previousElementSibling.value = '';
            }
        }

        async function createOrder() {
            const name = document.getElementById('new-name').value;
            const eta = document.getElementById('new-eta').value;
            
            const productInputs = document.querySelectorAll('.product-input');
            const productList = Array.from(productInputs).map(i => i.value.trim()).filter(v => v);

            if (!name) return showCustomAlert("Public name is required to create an order.", "Missing Details", "red");

            const newOrderRef = db.collection('orders_public').doc(); 

            try {
                await newOrderRef.set({
                    name: name,
                    eta: eta || "TBA",
                    status: "Preparing",
                    products: productList,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updates: [{ date: new Date().toLocaleDateString(), msg: "Order placed and preparing." }]
                });

                showCustomAlert("Order successfully created.", "Success", "emerald");
                document.getElementById('new-name').value = '';
                document.getElementById('new-eta').value = '';
                document.getElementById('products-container').innerHTML = `
                    <div class="flex gap-2 product-line">
                        <input type="text" placeholder="e.g. Gem Vol 4" class="product-input flex-1 p-2 border rounded bg-zinc-50 text-sm">
                        <button type="button" onclick="removeProductLine(this)" class="bg-red-100 text-red-600 px-3 py-1 rounded font-bold hover:bg-red-200">✕</button>
                    </div>
                `;
                loadOrders();
            } catch (error) {
                showCustomAlert("Error saving order: " + error.message, "System Error", "red");
            }
        }

        async function loadOrders() {
            const list = document.getElementById('orders-list');
            try {
                const publicSnap = await db.collection('orders_public').get();
                
                if (publicSnap.empty) {
                    list.innerHTML = '<p class="text-center text-zinc-500 mt-4">No orders found.</p>';
                    return;
                }

                let ordersArray = [];
                publicSnap.forEach(doc => ordersArray.push({ id: doc.id, ...doc.data() }));
                
                ordersArray.sort((a, b) => {
                    let timeA = a.createdAt && typeof a.createdAt.toMillis === 'function' ? a.createdAt.toMillis() : 0;
                    let timeB = b.createdAt && typeof b.createdAt.toMillis === 'function' ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                list.innerHTML = '';
                allOrdersData = {}; 

                for (let pubData of ordersArray) {
                    allOrdersData[pubData.id] = {
                        name: pubData.name,
                        eta: pubData.eta,
                        status: pubData.status || 'Preparing',
                        products: pubData.products || []
                    };

                    let updatesHTML = pubData.updates ? pubData.updates.map(u => `<li class="text-xs text-zinc-600 border-l-2 border-blue-500 pl-2 ml-2 my-1"><span class="font-bold">${u.date}:</span> ${u.msg}</li>`).join('') : '';
                    let productsHTML = pubData.products && pubData.products.length > 0 ? pubData.products.join(', ') : 'None';

                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-zinc-200">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-black text-lg text-zinc-800">${pubData.name}</h3>
                                    <p class="text-xs font-bold text-zinc-500">ETA: <span class="text-zinc-800">${pubData.eta || 'TBA'}</span></p>
                                </div>
                                <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded">${pubData.status || "Unknown"}</span>
                            </div>
                            
                            <div class="bg-zinc-50 p-2 rounded mb-3 border border-zinc-200">
                                <p class="text-[10px] font-bold text-zinc-500 uppercase">Products Included:</p>
                                <p class="text-xs text-zinc-800 font-bold">${productsHTML}</p>
                            </div>

                            <div class="mb-3">
                                <p class="text-xs font-bold text-zinc-400 uppercase mb-1">Public Timeline</p>
                                <ul class="space-y-1">${updatesHTML}</ul>
                            </div>
                            
                            <p class="text-[10px] font-bold text-zinc-400 uppercase mb-1 mt-4">1-Click Updates</p>
                            <div class="flex flex-wrap gap-1.5 mb-3">
                                <button onclick="addQuickUpdate('${pubData.id}', 'Preparing order for shipment.', 'Preparing')" class="bg-zinc-200 hover:bg-zinc-300 text-zinc-800 font-bold px-2.5 py-1 rounded text-xs">Preparing</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Shipped from China.', 'Shipped')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold px-2.5 py-1 rounded text-xs">Shipped</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'In transit to Australia.', 'In Transit')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold px-2.5 py-1 rounded text-xs">In Transit</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Undergoing customs clearance.', 'Customs')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-2.5 py-1 rounded text-xs">Customs</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Arrived at AusPost Facility.', 'AusPost Hub')" class="bg-purple-100 hover:bg-purple-200 text-purple-800 font-bold px-2.5 py-1 rounded text-xs">AusPost Hub</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Out for delivery with AusPost.', 'Out for Delivery')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold px-2.5 py-1 rounded text-xs">AusPost On The Way</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Delivered and ready for sale!', 'Delivered')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold px-2.5 py-1 rounded text-xs">Delivered</button>
                                
                                <button onclick="undoLastUpdate('${pubData.id}')" class="bg-red-100 hover:bg-red-200 text-red-800 font-bold px-2.5 py-1 rounded text-xs ml-auto border border-red-200 transition-colors">↩ Undo Update</button>
                            </div>

                            <div class="border-t border-zinc-200 pt-3 mt-1">
                                <button onclick="openEditModal('${pubData.id}')" class="w-full text-xs bg-zinc-800 text-white font-bold px-3 py-2 rounded hover:bg-zinc-700 shadow-sm transition-colors">
                                    Edit Order Data
                                </button>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                list.innerHTML = `<p class="text-center text-red-500 font-bold mt-4">Error loading orders: ${error.message}</p>`;
            }
        }

        function addQuickUpdate(docId, msg, statusStr) {
            showCustomConfirm(`Update status to "${statusStr}" and push update to live tracking?`, async () => {
                try {
                    const docRef = db.collection('orders_public').doc(docId);
                    const updateData = {
                        status: statusStr,
                        updates: firebase.firestore.FieldValue.arrayUnion({
                            date: new Date().toLocaleDateString(),
                            msg: msg
                        })
                    };
                    if (statusStr === "Delivered") {
                        updateData.deliveredDate = new Date().toLocaleDateString();
                    }
                    await docRef.update(updateData);
                    loadOrders();
                } catch (error) {
                    showCustomAlert("Error posting update: " + error.message, "Update Failed", "red");
                }
            }, "Confirm Update");
        }

        // --- ↩️ NEW INTELLIGENT UNDO LOGIC ---
        async function undoLastUpdate(docId) {
            showCustomConfirm("Are you sure you want to delete the most recent timeline update? This is useful if you clicked the wrong button.", async () => {
                try {
                    const docRef = db.collection('orders_public').doc(docId);
                    const doc = await docRef.get();
                    if (!doc.exists) return;
                    
                    const data = doc.data();
                    
                    if (data.updates && data.updates.length > 1) {
                        data.updates.pop(); // Remove the last timeline message
                        
                        // Parse the NEW last message to figure out what status to revert to
                        const lastMsg = data.updates[data.updates.length - 1].msg || "";
                        let revertedStatus = "Preparing"; // Default Fallback
                        
                        if (lastMsg.includes("Shipped")) revertedStatus = "Shipped";
                        else if (lastMsg.includes("In transit")) revertedStatus = "In Transit";
                        else if (lastMsg.includes("customs")) revertedStatus = "Customs";
                        else if (lastMsg.includes("AusPost Facility")) revertedStatus = "AusPost Hub";
                        else if (lastMsg.includes("Out for delivery")) revertedStatus = "Out for Delivery";
                        else if (lastMsg.includes("Delivered")) revertedStatus = "Delivered";

                        const updatePayload = {
                            updates: data.updates,
                            status: revertedStatus
                        };
                        
                        // If we are undoing a delivery, erase the delivery date stamp
                        if (data.deliveredDate && revertedStatus !== "Delivered") {
                            updatePayload.deliveredDate = firebase.firestore.FieldValue.delete();
                        }

                        await docRef.update(updatePayload);
                        loadOrders();
                    } else {
                        showCustomAlert("You cannot delete the very first creation update.", "Action Denied", "amber");
                    }
                } catch (error) {
                    showCustomAlert("Error undoing update: " + error.message, "System Error", "red");
                }
            }, "Undo Last Update", true);
        }

        function openEditModal(id) {
            const data = allOrdersData[id];
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = data.name || '';
            document.getElementById('edit-eta').value = data.eta === 'TBA' ? '' : (data.eta || '');
            
            const statusSelect = document.getElementById('edit-status');
            if (Array.from(statusSelect.options).some(opt => opt.value === data.status)) {
                statusSelect.value = data.status;
            } else {
                statusSelect.value = "Preparing"; 
            }

            document.getElementById('edit-products').value = (data.products || []).join(', ');
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function saveEditOrder() {
            const id = document.getElementById('edit-id').value;
            const newName = document.getElementById('edit-name').value;
            const newEta = document.getElementById('edit-eta').value;
            const newStatus = document.getElementById('edit-status').value;
            const productsRaw = document.getElementById('edit-products').value;

            if (!newName) return showCustomAlert("Public name cannot be empty!", "Missing Details", "red");

            const productList = productsRaw.split(',').map(p => p.trim()).filter(p => p);

            try {
                await db.collection('orders_public').doc(id).update({
                    name: newName,
                    eta: newEta || "TBA",
                    status: newStatus,
                    products: productList
                });

                showCustomAlert("Order updated successfully.", "Success", "emerald");
                closeEditModal();
                loadOrders();
            } catch (error) {
                showCustomAlert("Error updating order: " + error.message, "System Error", "red");
            }
        }

        function deleteOrder() {
            showCustomConfirm("This will erase the order from the public app permanently.", () => {
                showCustomConfirm("FINAL WARNING: This action cannot be undone. Continue?", async () => {
                    try {
                        const id = document.getElementById('edit-id').value;
                        await db.collection('orders_public').doc(id).delete();
                        
                        showCustomAlert("Order permanently deleted.", "Deleted", "emerald");
                        closeEditModal();
                        loadOrders(); 
                    } catch (error) {
                        showCustomAlert("Error deleting order: " + error.message, "System Error", "red");
                    }
                }, "Permanent Deletion", true);
            }, "Confirm Deletion", true);
        }
    </script>
</body>
</html>
