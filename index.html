<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f4f4f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Order Admin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-zinc-100 p-4 md:p-8 font-sans pb-20">

    <div class="max-w-xl mx-auto">
        <h1 class="text-2xl md:text-3xl font-black text-zinc-800 mb-6 text-center md:text-left">Order Admin</h1>

        <div id="loading-section" class="flex flex-col items-center justify-center py-20">
            <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
            <p class="text-zinc-500 font-bold text-sm animate-pulse">Authenticating...</p>
        </div>

        <div id="login-section" class="hidden bg-white p-5 md:p-6 rounded-xl shadow-md mb-6">
            <h2 class="font-bold mb-4 text-xl">Admin Login</h2>
            <div id="login-error" class="hidden bg-red-100 text-red-600 p-3 rounded-lg mb-4 text-sm font-bold"></div>
            <input type="email" id="email" placeholder="Email Address" class="w-full p-3 border rounded-lg mb-3 bg-zinc-50">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg mb-4 bg-zinc-50">
            <button onclick="login()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg w-full transition-colors">Sign In</button>
        </div>

        <div id="admin-section" class="hidden space-y-6">
            
            <div class="bg-white p-5 md:p-6 rounded-xl shadow-md border-t-4 border-emerald-500">
                <h2 class="font-bold mb-4 text-lg md:text-xl text-emerald-600">Create New Order</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-xs font-bold text-zinc-500 uppercase">Public Name</label>
                        <input type="text" id="new-name" placeholder="e.g. July Order 01" class="w-full p-3 border rounded-lg bg-zinc-50 mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-zinc-500 uppercase">Estimated ETA</label>
                        <input type="date" id="new-eta" class="w-full p-3 border rounded-lg bg-zinc-50 mt-1">
                    </div>
                </div>

                <div class="mb-5">
                    <label class="text-xs font-bold text-zinc-500 uppercase mb-2 block">Products Included</label>
                    <div id="products-container" class="space-y-2">
                        <div class="flex gap-2 product-line">
                            <input type="text" placeholder="e.g. Gem Vol 4" class="product-input flex-1 p-3 border rounded-lg bg-zinc-50 text-sm">
                            <button type="button" onclick="removeProductLine(this)" class="bg-red-100 text-red-600 px-4 rounded-lg font-bold hover:bg-red-200">✕</button>
                        </div>
                    </div>
                    <button type="button" onclick="addProductLine()" class="mt-3 text-sm bg-zinc-200 hover:bg-zinc-300 text-zinc-700 font-bold py-2 px-4 rounded-lg flex items-center justify-center gap-1 transition-colors w-full md:w-auto">
                        <span>+</span> Add Another Product
                    </button>
                </div>

                <button onclick="createOrder()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3 px-4 rounded-lg w-full transition-colors shadow-sm">Create Order</button>
            </div>

            <div id="orders-list" class="space-y-4">
                <p class="text-zinc-500 text-center font-bold animate-pulse">Loading orders...</p>
            </div>
            
            <button onclick="logout()" class="text-sm text-zinc-500 hover:text-zinc-800 underline mt-8 block mx-auto py-4">Logout</button>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4 z-50">
        <div class="bg-white rounded-t-2xl md:rounded-xl shadow-2xl p-5 md:p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto border-t-4 border-blue-500 animate-fade-in-up">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl md:text-2xl font-black text-zinc-800">Edit Order</h2>
                <button onclick="closeEditModal()" class="text-zinc-400 hover:text-zinc-800 text-2xl font-black px-2">&times;</button>
            </div>
            
            <input type="hidden" id="edit-id">
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase">Public Name</label>
                    <input type="text" id="edit-name" class="w-full p-3 border rounded-lg bg-zinc-50 mt-1 font-bold">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-zinc-500 uppercase">Estimated ETA</label>
                        <input type="date" id="edit-eta" class="w-full p-3 border rounded-lg bg-zinc-50 mt-1 font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-500 uppercase">Current Status Badge</label>
                        <select id="edit-status" class="w-full p-3 border rounded-lg bg-zinc-50 mt-1 font-bold text-sm">
                            <option value="Preparing">Preparing</option>
                            <option value="Shipped">Shipped</option>
                            <option value="In Transit">In Transit</option>
                            <option value="Customs">Customs</option>
                            <option value="AusPost Hub">AusPost Hub</option>
                            <option value="Out for Delivery">Out for Delivery</option>
                            <option value="Delivered">Delivered</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-zinc-500 uppercase">Products (Comma Separated)</label>
                    <textarea id="edit-products" class="w-full p-3 border rounded-lg bg-zinc-50 mt-1 font-bold text-sm" rows="2" placeholder="Item 1, Item 2"></textarea>
                </div>

                <div class="pt-2">
                    <label class="block text-xs font-bold text-zinc-500 uppercase mb-2">Edit Timeline History</label>
                    <div id="edit-updates-container" class="space-y-2 bg-zinc-50 p-2 rounded-lg border border-zinc-200">
                        </div>
                </div>
            </div>
            
            <button onclick="saveEditOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-lg transition-colors shadow-md mb-4">Save Changes</button>

            <div class="pt-4 border-t-2 border-red-100 border-dashed">
                <button onclick="deleteOrder()" class="w-full bg-red-50 hover:bg-red-500 hover:text-white text-red-600 border border-red-200 font-black py-3 rounded-lg transition-all">
                    DELETE ORDER
                </button>
            </div>
        </div>
    </div>

    <div id="custom-alert" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-blue-500 text-center animate-fade-in-up">
            <h3 id="alert-title" class="text-lg font-black text-zinc-800 mb-2">Notice</h3>
            <p id="alert-message" class="text-sm text-zinc-600 mb-6"></p>
            <button onclick="closeAlert()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-lg transition-colors w-full">OK</button>
        </div>
    </div>

    <div id="custom-confirm" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
        <div id="confirm-border" class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-amber-500 text-center animate-fade-in-up">
            <h3 id="confirm-title" class="text-lg font-black text-zinc-800 mb-2">Confirm</h3>
            <p id="confirm-message" class="text-sm text-zinc-600 mb-6"></p>
            <div class="flex gap-3">
                <button onclick="closeConfirm(false)" class="flex-1 bg-zinc-200 hover:bg-zinc-300 text-zinc-800 font-bold px-4 py-3 rounded-lg transition-colors">Cancel</button>
                <button id="confirm-yes-btn" onclick="closeConfirm(true)" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-3 rounded-lg transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.2s ease-out forwards; }
    </style>

    <script>
        // 📅 CUSTOM DATE FORMATTER (Translates YYYY-MM-DD to "Thur, 6th AUG 2026")
        function formatEtaDate(dateString) {
            if (!dateString || dateString === 'TBA') return 'TBA';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString; 
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            if (isNaN(d)) return dateString;

            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thur', 'Fri', 'Sat'];
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            
            const dayName = days[d.getDay()];
            const monthName = months[d.getMonth()];
            const dateNum = d.getDate();
            const year = d.getFullYear();

            const getOrdinal = (n) => {
                if (n > 3 && n < 21) return 'th';
                switch (n % 10) {
                    case 1:  return "st";
                    case 2:  return "nd";
                    case 3:  return "rd";
                    default: return "th";
                }
            };

            return `${dayName}, ${dateNum}${getOrdinal(dateNum)} ${monthName} ${year}`;
        }

        // --- CUSTOM MODAL CONTROLLERS ---
        function showCustomAlert(message, title = "Notice", color = "blue") {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('custom-alert').firstElementChild.className = `bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-${color}-500 text-center animate-fade-in-up`;
            document.getElementById('custom-alert').classList.remove('hidden');
        }
        function closeAlert() { document.getElementById('custom-alert').classList.add('hidden'); }

        let pendingConfirmCallback = null;
        function showCustomConfirm(message, callback, title = "Confirm Action", isDanger = false) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            
            const borderBox = document.getElementById('confirm-border');
            const yesBtn = document.getElementById('confirm-yes-btn');
            
            if (isDanger) {
                borderBox.className = "bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-red-600 text-center animate-fade-in-up";
                yesBtn.className = "flex-1 bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-3 rounded-lg transition-colors";
            } else {
                borderBox.className = "bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm border-t-4 border-blue-500 text-center animate-fade-in-up";
                yesBtn.className = "flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-3 rounded-lg transition-colors";
            }

            pendingConfirmCallback = callback;
            document.getElementById('custom-confirm').classList.remove('hidden');
        }
        
        function closeConfirm(result) {
            document.getElementById('custom-confirm').classList.add('hidden');
            const callbackToRun = pendingConfirmCallback;
            pendingConfirmCallback = null; 
            if (result && callbackToRun) {
                callbackToRun();
            }
        }

        // 🛑 FIREBASE KEYS 🛑
        const firebaseConfig = {
            apiKey: "AIzaSyAHD0_l3t-aTEdlE_28Bspluk7KpL2GAbw",
            authDomain: "order-tracker-58390.firebaseapp.com",
            projectId: "order-tracker-58390",
            storageBucket: "order-tracker-58390.firebasestorage.app",
            messagingSenderId: "599840735038",
            appId: "1:599840735038:web:ce7938b2666e24d01c766f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allOrdersData = {};

        auth.onAuthStateChanged(user => {
            document.getElementById('loading-section').classList.add('hidden');
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadOrders();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        });

        function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => {
                document.getElementById('login-error').innerText = err.message;
                document.getElementById('login-error').classList.remove('hidden');
            });
        }

        function logout() { auth.signOut(); }

        function addProductLine(value = '') {
            const container = document.getElementById('products-container');
            const div = document.createElement('div');
            div.className = 'flex gap-2 product-line';
            div.innerHTML = `
                <input type="text" placeholder="e.g. Gem Vol 5" value="${value}" class="product-input flex-1 p-3 border rounded-lg bg-zinc-50 text-sm">
                <button type="button" onclick="removeProductLine(this)" class="bg-red-100 text-red-600 px-4 rounded-lg font-bold hover:bg-red-200">✕</button>
            `;
            container.appendChild(div);
        }

        function removeProductLine(btn) {
            const container = document.getElementById('products-container');
            if (container.querySelectorAll('.product-line').length > 1) {
                btn.closest('.product-line').remove();
            } else {
                btn.previousElementSibling.value = '';
            }
        }

        async function createOrder() {
            const name = document.getElementById('new-name').value;
            const eta = document.getElementById('new-eta').value;
            
            const productInputs = document.querySelectorAll('.product-input');
            const productList = Array.from(productInputs).map(i => i.value.trim()).filter(v => v);

            if (!name) return showCustomAlert("Public name is required to create an order.", "Missing Details", "red");

            const newOrderRef = db.collection('orders_public').doc(); 

            try {
                await newOrderRef.set({
                    name: name,
                    eta: eta || "TBA",
                    status: "Preparing",
                    products: productList,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updates: [{ date: new Date().toLocaleDateString(), msg: "Order placed and preparing." }]
                });

                showCustomAlert("Order successfully created.", "Success", "emerald");
                document.getElementById('new-name').value = '';
                document.getElementById('new-eta').value = '';
                document.getElementById('products-container').innerHTML = `
                    <div class="flex gap-2 product-line">
                        <input type="text" placeholder="e.g. Gem Vol 4" class="product-input flex-1 p-3 border rounded-lg bg-zinc-50 text-sm">
                        <button type="button" onclick="removeProductLine(this)" class="bg-red-100 text-red-600 px-4 rounded-lg font-bold hover:bg-red-200">✕</button>
                    </div>
                `;
                loadOrders();
            } catch (error) {
                showCustomAlert("Error saving order: " + error.message, "System Error", "red");
            }
        }

        async function loadOrders() {
            const list = document.getElementById('orders-list');
            try {
                const publicSnap = await db.collection('orders_public').get();
                
                if (publicSnap.empty) {
                    list.innerHTML = '<p class="text-center text-zinc-500 mt-4 bg-white p-6 rounded-xl shadow-sm border border-zinc-200">No active orders found.</p>';
                    return;
                }

                let ordersArray = [];
                publicSnap.forEach(doc => ordersArray.push({ id: doc.id, ...doc.data() }));
                
                ordersArray.sort((a, b) => {
                    let timeA = a.createdAt && typeof a.createdAt.toMillis === 'function' ? a.createdAt.toMillis() : 0;
                    let timeB = b.createdAt && typeof b.createdAt.toMillis === 'function' ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                list.innerHTML = '';
                allOrdersData = {}; 

                for (let pubData of ordersArray) {
                    allOrdersData[pubData.id] = {
                        name: pubData.name,
                        eta: pubData.eta,
                        status: pubData.status || 'Preparing',
                        products: pubData.products || [],
                        updates: pubData.updates || [] // Now storing updates locally
                    };

                    let updatesHTML = pubData.updates ? pubData.updates.map(u => `<li class="text-xs text-zinc-600 border-l-2 border-blue-500 pl-2 ml-2 my-1"><span class="font-bold">${u.date}:</span> ${u.msg}</li>`).join('') : '';
                    let productsHTML = pubData.products && pubData.products.length > 0 ? pubData.products.join(', ') : 'None';

                    list.innerHTML += `
                        <div class="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-zinc-200">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="font-black text-lg text-zinc-800">${pubData.name}</h3>
                                    <p class="text-xs font-bold text-zinc-500">ETA: <span class="text-zinc-800">${formatEtaDate(pubData.eta)}</span></p>
                                </div>
                                <span class="bg-blue-100 text-blue-700 text-[10px] font-black uppercase tracking-wider px-2 py-1 rounded-md shadow-sm">${pubData.status || "Unknown"}</span>
                            </div>
                            
                            <div class="bg-zinc-50 p-2 rounded-lg mb-3 border border-zinc-100">
                                <p class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Products Included:</p>
                                <p class="text-xs text-zinc-800 font-bold">${productsHTML}</p>
                            </div>

                            <div class="mb-4">
                                <p class="text-[9px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Timeline</p>
                                <ul class="space-y-1">${updatesHTML}</ul>
                            </div>
                            
                            <p class="text-[9px] font-bold text-zinc-400 uppercase mb-2">Update Status</p>
                            <div class="flex flex-wrap gap-2 mb-3">
                                <button onclick="addQuickUpdate('${pubData.id}', 'Preparing order for shipment.', 'Preparing')" class="bg-zinc-200 hover:bg-zinc-300 text-zinc-800 font-bold px-3 py-2 rounded-lg text-xs flex-grow md:flex-grow-0">Preparing</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Shipped from China.', 'Shipped')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold px-3 py-2 rounded-lg text-xs flex-grow md:flex-grow-0">Shipped</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'In transit to Australia.', 'In Transit')" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold px-3 py-2 rounded-lg text-xs flex-grow md:flex-grow-0">In Transit</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Undergoing customs clearance.', 'Customs')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-3 py-2 rounded-lg text-xs flex-grow md:flex-grow-0">Customs</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Arrived at AusPost Facility.', 'AusPost Hub')" class="bg-purple-100 hover:bg-purple-200 text-purple-800 font-bold px-3 py-2 rounded-lg text-xs flex-grow md:flex-grow-0">AusPost</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Out for delivery with AusPost.', 'Out for Delivery')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold px-3 py-2 rounded-lg text-xs flex-grow md:flex-grow-0">On The Way</button>
                                <button onclick="addQuickUpdate('${pubData.id}', 'Delivered and ready for sale!', 'Delivered')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold px-3 py-2 rounded-lg text-xs w-full md:w-auto mt-1 md:mt-0">Delivered</button>
                            </div>

                            <div class="flex flex-col md:flex-row gap-2 border-t border-zinc-100 pt-3">
                                <button onclick="openEditModal('${pubData.id}')" class="flex-1 text-xs bg-zinc-800 text-white font-bold px-3 py-2.5 rounded-lg hover:bg-zinc-700 shadow-sm transition-colors text-center">
                                    Edit Order & Timeline
                                </button>
                                <button onclick="undoLastUpdate('${pubData.id}')" class="flex-1 text-xs bg-red-50 text-red-600 border border-red-200 font-bold px-3 py-2.5 rounded-lg hover:bg-red-100 transition-colors text-center">
                                    ↩ Undo Update
                                </button>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                list.innerHTML = `<p class="text-center text-red-500 font-bold mt-4">Error loading orders: ${error.message}</p>`;
            }
        }

        function addQuickUpdate(docId, msg, statusStr) {
            showCustomConfirm(`Update status to "${statusStr}" and push update to live tracking?`, async () => {
                try {
                    const docRef = db.collection('orders_public').doc(docId);
                    const updateData = {
                        status: statusStr,
                        updates: firebase.firestore.FieldValue.arrayUnion({
                            date: new Date().toLocaleDateString(),
                            msg: msg
                        })
                    };
                    if (statusStr === "Delivered") {
                        updateData.deliveredDate = new Date().toLocaleDateString();
                    }
                    await docRef.update(updateData);
                    loadOrders();
                } catch (error) {
                    showCustomAlert("Error posting update: " + error.message, "Update Failed", "red");
                }
            }, "Confirm Update");
        }

        async function undoLastUpdate(docId) {
            showCustomConfirm("Delete the most recent timeline update?", async () => {
                try {
                    const docRef = db.collection('orders_public').doc(docId);
                    const doc = await docRef.get();
                    if (!doc.exists) return;
                    
                    const data = doc.data();
                    
                    if (data.updates && data.updates.length > 1) {
                        data.updates.pop(); 
                        
                        const lastMsg = data.updates[data.updates.length - 1].msg || "";
                        let revertedStatus = "Preparing"; 
                        
                        if (lastMsg.includes("Shipped")) revertedStatus = "Shipped";
                        else if (lastMsg.includes("In transit")) revertedStatus = "In Transit";
                        else if (lastMsg.includes("customs")) revertedStatus = "Customs";
                        else if (lastMsg.includes("AusPost Facility")) revertedStatus = "AusPost Hub";
                        else if (lastMsg.includes("Out for delivery")) revertedStatus = "Out for Delivery";
                        else if (lastMsg.includes("Delivered")) revertedStatus = "Delivered";

                        const updatePayload = {
                            updates: data.updates,
                            status: revertedStatus
                        };
                        
                        if (data.deliveredDate && revertedStatus !== "Delivered") {
                            updatePayload.deliveredDate = firebase.firestore.FieldValue.delete();
                        }

                        await docRef.update(updatePayload);
                        loadOrders();
                    } else {
                        showCustomAlert("You cannot delete the very first creation update.", "Action Denied", "amber");
                    }
                } catch (error) {
                    showCustomAlert("Error undoing update: " + error.message, "System Error", "red");
                }
            }, "Undo Last Update", true);
        }

        // ⏱️ POPULATE EDIT MODAL WITH TIMELINE DATA
        function openEditModal(id) {
            const data = allOrdersData[id];
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = data.name || '';
            document.getElementById('edit-eta').value = data.eta === 'TBA' ? '' : (data.eta || '');
            
            const statusSelect = document.getElementById('edit-status');
            if (Array.from(statusSelect.options).some(opt => opt.value === data.status)) {
                statusSelect.value = data.status;
            } else {
                statusSelect.value = "Preparing"; 
            }

            document.getElementById('edit-products').value = (data.products || []).join(', ');

            // Populate Timeline Editor
            const updatesContainer = document.getElementById('edit-updates-container');
            updatesContainer.innerHTML = '';
            
            if (data.updates && data.updates.length > 0) {
                data.updates.forEach(u => {
                    updatesContainer.innerHTML += `
                        <div class="flex gap-2 update-line items-center">
                            <input type="text" class="update-date w-28 p-2 border border-zinc-200 rounded text-xs font-bold text-zinc-700" value="${u.date}" placeholder="Date">
                            <input type="text" class="update-msg flex-1 p-2 border border-zinc-200 rounded text-xs text-zinc-700" value="${u.msg}" placeholder="Message">
                            <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600 font-bold px-2 text-lg leading-none">&times;</button>
                        </div>
                    `;
                });
            } else {
                updatesContainer.innerHTML = '<p class="text-xs text-zinc-400 p-2">No updates recorded.</p>';
            }

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function saveEditOrder() {
            const id = document.getElementById('edit-id').value;
            const newName = document.getElementById('edit-name').value;
            const newEta = document.getElementById('edit-eta').value;
            const newStatus = document.getElementById('edit-status').value;
            const productsRaw = document.getElementById('edit-products').value;

            if (!newName) return showCustomAlert("Public name cannot be empty!", "Missing Details", "red");

            const productList = productsRaw.split(',').map(p => p.trim()).filter(p => p);

            // ⏱️ GATHER EDITED TIMELINE
            const updateLines = document.querySelectorAll('.update-line');
            let updatedTimeline = [];
            updateLines.forEach(line => {
                const d = line.querySelector('.update-date').value.trim();
                const m = line.querySelector('.update-msg').value.trim();
                if (d && m) {
                    updatedTimeline.push({ date: d, msg: m });
                }
            });

            try {
                let updatePayload = {
                    name: newName,
                    eta: newEta || "TBA",
                    status: newStatus,
                    products: productList,
                    updates: updatedTimeline
                };

                // If marked delivered, sync the delivered date to the last timeline entry
                if (newStatus === "Delivered" && updatedTimeline.length > 0) {
                    updatePayload.deliveredDate = updatedTimeline[updatedTimeline.length - 1].date;
                }

                await db.collection('orders_public').doc(id).update(updatePayload);

                showCustomAlert("Order and timeline updated successfully.", "Success", "emerald");
                closeEditModal();
                loadOrders();
            } catch (error) {
                showCustomAlert("Error updating order: " + error.message, "System Error", "red");
            }
        }

        function deleteOrder() {
            showCustomConfirm("This will erase the order from the public app permanently.", () => {
                showCustomConfirm("FINAL WARNING: This action cannot be undone. Continue?", async () => {
                    try {
                        const id = document.getElementById('edit-id').value;
                        await db.collection('orders_public').doc(id).delete();
                        
                        showCustomAlert("Order permanently deleted.", "Deleted", "emerald");
                        closeEditModal();
                        loadOrders(); 
                    } catch (error) {
                        showCustomAlert("Error deleting order: " + error.message, "System Error", "red");
                    }
                }, "Permanent Deletion", true);
            }, "Confirm Deletion", true);
        }
    </script>
</body>
</html>
